<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Betoch · ቤቶች — Property Cash Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f3ee;
      --card-bg: #ffffff;
      --border: rgba(0, 0, 0, 0.07);
      --text-main: #191c1a;
      --text-sub: #6c726d;
      --text-muted: #959b96;
      --green: #1c8a5f;
      --green-light: rgba(28, 138, 95, 0.12);
      --green-hero-1: #0e4d3a;
      --green-hero-2: #1f8f68;
      --red: #d2553f;
      --red-light: rgba(210, 85, 63, 0.12);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.06);
      --radius-card: 22px;
      --radius-hero: 28px;
      --font-family: 'Inter', system-ui, 'Noto Sans Ethiopic', 'Nyala', sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0d1411;
      --card-bg: #141f1a;
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #edf2ee;
      --text-sub: #9ca69e;
      --text-muted: #647067;
      --green: #25a874;
      --green-light: rgba(37, 168, 116, 0.18);
      --green-hero-1: #08291f;
      --green-hero-2: #13533d;
      --red: #e0624c;
      --red-light: rgba(224, 98, 76, 0.18);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 12px 35px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text-main);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
    }

    .container {
      width: 100%;
      max-width: 760px;
      padding: 16px 20px 100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ─── 1. TOP BAR ─────────────────────────────────────── */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .brand-logo {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }

    .brand-amharic {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--green);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-toggle {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      box-shadow: var(--shadow-sm);
    }

    .pill-btn {
      border: none;
      background: transparent;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-btn.active {
      background: var(--green);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(28, 138, 95, 0.35);
    }

    .theme-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease;
    }

    .theme-btn:active {
      transform: scale(0.92);
    }

    /* ─── 2. HERO CARD ───────────────────────────────────── */
    .hero-card {
      position: relative;
      background: linear-gradient(145deg, var(--green-hero-1) 0%, var(--green-hero-2) 100%);
      border-radius: var(--radius-hero);
      padding: 32px 28px;
      color: #ffffff;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(14, 77, 58, 0.28);
    }

    .hero-circle-1, .hero-circle-2 {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .hero-circle-1 {
      width: 220px;
      height: 220px;
      top: -60px;
      right: -50px;
    }

    .hero-circle-2 {
      width: 140px;
      height: 140px;
      bottom: -40px;
      left: 20%;
    }

    .hero-label {
      font-size: 0.95rem;
      font-weight: 500;
      opacity: 0.88;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .hero-amount-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
    }

    .hero-amount {
      font-size: 3.4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .hero-currency {
      font-size: 1.25rem;
      font-weight: 600;
      opacity: 0.82;
    }

    .hero-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
    }

    /* ─── 3. THREE STAT CARDS ────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .text-green { color: var(--green); }
    .text-red { color: var(--red); }

    /* ─── 4. MONTH BY MONTH CHART CARD ───────────────────── */
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 24px 20px;
      box-shadow: var(--shadow-sm);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .chart-caption {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
      height: 190px;
      align-items: center;
      position: relative;
      margin-bottom: 8px;
    }

    .chart-baseline {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border);
      pointer-events: none;
    }

    .chart-col {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      border-radius: 8px;
      padding: 2px;
      transition: background 0.15s ease;
    }

    .chart-col:hover {
      background: rgba(0, 0, 0, 0.03);
    }
    [data-theme="dark"] .chart-col:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .chart-col.selected {
      background: var(--green-light);
    }

    .bar-up-wrap, .bar-down-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .bar-down-wrap {
      align-items: flex-start;
    }

    .bar-in {
      width: 12px;
      background: var(--green);
      border-radius: 6px 6px 2px 2px;
      transform-origin: bottom;
      transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bar-out {
      width: 12px;
      background: var(--red);
      border-radius: 2px 2px 6px 6px;
      transform-origin: top;
      transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .chart-labels {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
      text-align: center;
    }

    .month-tag {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      transition: color 0.15s ease;
    }

    .month-tag.active {
      color: var(--green);
      font-weight: 700;
    }

    /* ─── 5. YOUR PROPERTIES ─────────────────────────────── */
    .properties-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 22px 20px;
      box-shadow: var(--shadow-sm);
    }

    .prop-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 14px;
    }

    .prop-item {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .prop-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      background: var(--green-light);
      flex-shrink: 0;
    }

    .prop-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prop-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .prop-bar-track {
      height: 5px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 999px;
      overflow: hidden;
      width: 100%;
    }
    [data-theme="dark"] .prop-bar-track {
      background: rgba(255, 255, 255, 0.08);
    }

    .prop-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .prop-amount {
      font-size: 0.98rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ─── 6. RECENT ACTIVITY ─────────────────────────────── */
    .activity-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 22px 20px;
      box-shadow: var(--shadow-sm);
    }

    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .activity-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 14px;
      transition: background 0.15s ease;
      position: relative;
    }

    .activity-item:hover {
      background: rgba(0, 0, 0, 0.025);
    }
    [data-theme="dark"] .activity-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .act-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .act-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      background: var(--green-light);
    }
    .act-icon.expense {
      background: var(--red-light);
    }

    .act-info {
      display: flex;
      flex-direction: column;
    }

    .act-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .act-sub {
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    .act-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .act-amt {
      font-size: 0.98rem;
      font-weight: 700;
    }

    .act-del-btn {
      opacity: 0;
      border: none;
      background: transparent;
      color: var(--red);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: opacity 0.15s ease;
      font-size: 0.9rem;
    }

    .activity-item:hover .act-del-btn {
      opacity: 1;
    }

    .show-all-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .show-all-btn:hover {
      background: rgba(0, 0, 0, 0.03);
      color: var(--text-main);
    }

    /* ─── 7. FLOATING + ADD PILL BUTTON ──────────────────── */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--green);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 24px rgba(28, 138, 95, 0.4);
      cursor: pointer;
      z-index: 100;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
    }

    .fab-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(28, 138, 95, 0.5);
    }
    .fab-btn:active {
      transform: scale(0.96);
    }

    /* ─── 8. BOTTOM SHEET MODAL ──────────────────────────── */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .sheet-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--card-bg);
      border-radius: 28px 28px 0 0;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 24px 34px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
      transform: translateY(105%);
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 201;
    }

    .sheet-overlay.open .bottom-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 999px;
      margin: 0 auto 18px;
    }

    .sheet-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .segmented-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .segment-btn {
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-sub);
      transition: all 0.2s ease;
    }

    .segment-btn.active.green {
      background: var(--green);
      color: #ffffff;
    }

    .segment-btn.active.red {
      background: var(--red);
      color: #ffffff;
    }

    .form-input, .form-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--green);
    }

    .save-btn {
      width: 100%;
      background: var(--green);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(28, 138, 95, 0.35);
      transition: opacity 0.2s ease;
    }

    .save-btn:active {
      opacity: 0.9;
    }

    /* ─── 9. FOOTER ──────────────────────────────────────── */
    .footer-line {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 10px;
    }

    @media (max-width: 520px) {
      .hero-amount { font-size: 2.8rem; }
      .stats-row { grid-template-columns: 1fr; }
      .bar-in, .bar-out { width: 8px; }
      .chart-labels { font-size: 0.65rem; }
      .act-del-btn { opacity: 0.7; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. TOP BAR -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-logo">Betoch</span>
        <span class="brand-amharic">ቤቶች</span>
      </div>
      <div class="top-actions">
        <div class="pill-toggle">
          <button class="pill-btn active" id="btn-2018" onclick="setYear('2018 EC')">2018 EC</button>
          <button class="pill-btn" id="btn-2019" onclick="setYear('2019 EC')">2019 EC</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" title="Switch dark/light mode">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </header>

    <!-- 2. HERO CARD -->
    <section class="hero-card">
      <div class="hero-circle-1"></div>
      <div class="hero-circle-2"></div>
      <div class="hero-label">Total cash on hand</div>
      <div class="hero-amount-wrap">
        <span class="hero-amount" id="hero-cash">0</span>
        <span class="hero-currency">ETB</span>
      </div>
      <div class="hero-chip" id="hero-chip">▲ Calculating...</div>
    </section>

    <!-- 3. THREE STAT CARDS -->
    <section class="stats-row">
      <div class="stat-card">
        <span class="stat-label">Money in</span>
        <span class="stat-val text-green" id="stat-money-in">0 ETB</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Money out</span>
        <span class="stat-val text-red" id="stat-money-out">0 ETB</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Left over</span>
        <span class="stat-val" id="stat-left-over">0 ETB</span>
      </div>
    </section>

    <!-- 4. MONTH BY MONTH CHART CARD -->
    <section class="chart-card">
      <div class="card-header">
        <h2 class="card-title">Month by month</h2>
        <span class="chart-caption" id="chart-caption">Tap a month to filter</span>
      </div>
      <div class="chart-grid" id="chart-grid">
        <div class="chart-baseline"></div>
        <!-- 12 columns injected via JS -->
      </div>
      <div class="chart-labels" id="chart-labels">
        <!-- 12 labels injected via JS -->
      </div>
    </section>

    <!-- 5. YOUR PROPERTIES -->
    <section class="properties-card">
      <h2 class="card-title">Your properties</h2>
      <div class="prop-list" id="prop-list">
        <!-- Property items injected via JS -->
      </div>
    </section>

    <!-- 6. RECENT ACTIVITY -->
    <section class="activity-card">
      <div class="card-header" style="margin-bottom: 8px;">
        <h2 class="card-title">Recent activity</h2>
        <span class="chart-caption" id="activity-filter-label">All entries</span>
      </div>
      <div class="activity-list" id="activity-list">
        <!-- Activity entries injected via JS -->
      </div>
      <button class="show-all-btn" id="show-all-btn" onclick="toggleShowAll()">Show all</button>
    </section>

    <!-- 8. FOOTER -->
    <div class="footer-line">
      Demo with sample data · saved only in this browser
    </div>
  </div>

  <!-- 7. FLOATING + ADD PILL BUTTON -->
  <button class="fab-btn" onclick="openSheet()">
    <span>+ Add</span>
  </button>

  <!-- 8. BOTTOM SHEET MODAL -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheetOnBackdrop(event)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title">New Entry</h3>

      <div class="form-group">
        <div class="segmented-control">
          <button type="button" class="segment-btn active green" id="seg-in" onclick="setType('in')">Money in</button>
          <button type="button" class="segment-btn" id="seg-out" onclick="setType('out')">Money out</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Amount (ETB)</label>
        <input type="number" id="form-amount" class="form-input" placeholder="0" min="1" required />
      </div>

      <div class="form-group">
        <label class="form-label">Calendar Date / ቀን</label>
        <input type="date" id="form-date" class="form-input" required />
      </div>

      <div class="form-group">
        <label class="form-label">Note / Description</label>
        <input type="text" id="form-note" class="form-input" placeholder="e.g. Condominium rent" required />
      </div>

      <div class="form-group">
        <label class="form-label">Property / Group</label>
        <select id="form-group" class="form-select">
          <option value="Condominium">Condominium 🏢</option>
          <option value="Building 72">Building 72 🏘️</option>
          <option value="Hawassa lots">Hawassa lots 🌿</option>
          <option value="Ekub savings">Ekub savings 🤝</option>
          <option value="Taxes & family">Taxes & family 🧾</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Ethiopian Month</label>
        <select id="form-month" class="form-select">
          <option value="Meskerem">Meskerem (መስከረም)</option>
          <option value="Tikimt">Tikimt (ጥቅምት)</option>
          <option value="Hidar">Hidar (ኅዳር)</option>
          <option value="Tahsas">Tahsas (ታኅሣሥ)</option>
          <option value="Tir">Tir (ጥር)</option>
          <option value="Yekatit">Yekatit (የካቲት)</option>
          <option value="Megabit">Megabit (መጋቢት)</option>
          <option value="Miazia">Miazia (ሚያዝያ)</option>
          <option value="Ginbot">Ginbot (ግንቦት)</option>
          <option value="Sene">Sene (ሰኔ)</option>
          <option value="Hamle">Hamle (ሐምሌ)</option>
          <option value="Nehase">Nehase (ነሐሴ)</option>
          <option value="Year-end">Year-end (ዓመት ማጠቃለያ)</option>
        </select>
      </div>

      <button class="save-btn" onclick="saveEntry()">Save entry</button>
    </div>
  </div>

  <script>
    // ─── ETHIOPIAN MONTHS & METADATA ────────────────────────────────
    const ETH_MONTHS = [
      { id: "Meskerem", en: "Meskerem", am: "መስከረም", short: "Mes" },
      { id: "Tikimt", en: "Tikimt", am: "ጥቅምት", short: "Tik" },
      { id: "Hidar", en: "Hidar", am: "ኅዳር", short: "Hid" },
      { id: "Tahsas", en: "Tahsas", am: "ታኅሣሥ", short: "Tah" },
      { id: "Tir", en: "Tir", am: "ጥር", short: "Tir" },
      { id: "Yekatit", en: "Yekatit", am: "የካቲት", short: "Yek" },
      { id: "Megabit", en: "Megabit", am: "መጋቢት", short: "Meg" },
      { id: "Miazia", en: "Miazia", am: "ሚያዝያ", short: "Mia" },
      { id: "Ginbot", en: "Ginbot", am: "ግንቦት", short: "Gin" },
      { id: "Sene", en: "Sene", am: "ሰኔ", short: "Sen" },
      { id: "Hamle", en: "Hamle", am: "ሐምሌ", short: "Ham" },
      { id: "Nehase", en: "Nehase", am: "ነሐሴ", short: "Neh" }
    ];

    const GROUPS = [
      { id: "Condominium", name: "Condominium", emoji: "🏢", color: "#1c8a5f" },
      { id: "Building 72", name: "Building 72", emoji: "🏘️", color: "#2563eb" },
      { id: "Hawassa lots", name: "Hawassa lots", emoji: "🌿", color: "#10b981" },
      { id: "Ekub savings", name: "Ekub savings", emoji: "🤝", color: "#8b5cf6" },
      { id: "Taxes & family", name: "Taxes & family", emoji: "🧾", color: "#f59e0b" }
    ];

    // ─── SEED DATA ──────────────────────────────────────────────────
    function createSeedData() {
      const data2018 = [
        // Condominium rent: 21,000 per month for Yekatit to Ginbot, 14,000 in Sene, 30,000 in Hamle
        { year: "2018 EC", month: "Yekatit", group: "Condominium", name: "Condominium rent", amount: 21000, date: "2018-06-10" },
        { year: "2018 EC", month: "Megabit", group: "Condominium", name: "Condominium rent", amount: 21000, date: "2018-07-10" },
        { year: "2018 EC", month: "Miazia", group: "Condominium", name: "Condominium rent", amount: 21000, date: "2018-08-10" },
        { year: "2018 EC", month: "Ginbot", group: "Condominium", name: "Condominium rent", amount: 21000, date: "2018-09-10" },
        { year: "2018 EC", month: "Sene", group: "Condominium", name: "Condominium rent", amount: 14000, date: "2018-10-10" },
        { year: "2018 EC", month: "Hamle", group: "Condominium", name: "Condominium rent", amount: 30000, date: "2018-11-10" },

        // Building 72 rent: 34,500 per month from Yekatit to Nehase
        { year: "2018 EC", month: "Yekatit", group: "Building 72", name: "Building 72 rent", amount: 34500, date: "2018-06-15" },
        { year: "2018 EC", month: "Megabit", group: "Building 72", name: "Building 72 rent", amount: 34500, date: "2018-07-15" },
        { year: "2018 EC", month: "Miazia", group: "Building 72", name: "Building 72 rent", amount: 34500, date: "2018-08-15" },
        { year: "2018 EC", month: "Ginbot", group: "Building 72", name: "Building 72 rent", amount: 34500, date: "2018-09-15" },
        { year: "2018 EC", month: "Sene", group: "Building 72", name: "Building 72 rent", amount: 34500, date: "2018-10-15" },
        { year: "2018 EC", month: "Hamle", group: "Building 72", name: "Building 72 rent", amount: 34500, date: "2018-11-15" },
        { year: "2018 EC", month: "Nehase", group: "Building 72", name: "Building 72 rent", amount: 34500, date: "2018-12-15" },

        // Ekub contribution: -50,000 per month from Tir to Nehase
        { year: "2018 EC", month: "Tir", group: "Ekub savings", name: "Ekub contribution", amount: -50000, date: "2018-05-20" },
        { year: "2018 EC", month: "Yekatit", group: "Ekub savings", name: "Ekub contribution", amount: -50000, date: "2018-06-20" },
        { year: "2018 EC", month: "Megabit", group: "Ekub savings", name: "Ekub contribution", amount: -50000, date: "2018-07-20" },
        { year: "2018 EC", month: "Miazia", group: "Ekub savings", name: "Ekub contribution", amount: -50000, date: "2018-08-20" },
        { year: "2018 EC", month: "Ginbot", group: "Ekub savings", name: "Ekub contribution", amount: -50000, date: "2018-09-20" },
        { year: "2018 EC", month: "Sene", group: "Ekub savings", name: "Ekub contribution", amount: -50000, date: "2018-10-20" },
        { year: "2018 EC", month: "Hamle", group: "Ekub savings", name: "Ekub contribution", amount: -50000, date: "2018-11-20" },
        { year: "2018 EC", month: "Nehase", group: "Ekub savings", name: "Ekub contribution", amount: -50000, date: "2018-12-20" },

        // Ema allowance: -5,500 in Yekatit
        { year: "2018 EC", month: "Yekatit", group: "Taxes & family", name: "Ema allowance", amount: -5500, date: "2018-06-05" },

        // Property tax: -14,560 and rental income tax: -5,840 in Nehase
        { year: "2018 EC", month: "Nehase", group: "Taxes & family", name: "Property tax", amount: -14560, date: "2018-12-05" },
        { year: "2018 EC", month: "Nehase", group: "Taxes & family", name: "Rental income tax", amount: -5840, date: "2018-12-10" },

        // Hawassa monitoring: -7,850 in Megabit and -18,500 in Nehase
        { year: "2018 EC", month: "Megabit", group: "Hawassa lots", name: "Hawassa monitoring", amount: -7850, date: "2018-07-12" },
        { year: "2018 EC", month: "Nehase", group: "Hawassa lots", name: "Hawassa monitoring", amount: -18500, date: "2018-12-08" },

        // Caretakers: -1,200 per month from Ginbot to Nehase
        { year: "2018 EC", month: "Ginbot", group: "Building 72", name: "Caretakers", amount: -1200, date: "2018-09-30" },
        { year: "2018 EC", month: "Sene", group: "Building 72", name: "Caretakers", amount: -1200, date: "2018-10-30" },
        { year: "2018 EC", month: "Hamle", group: "Building 72", name: "Caretakers", amount: -1200, date: "2018-11-30" },
        { year: "2018 EC", month: "Nehase", group: "Building 72", name: "Caretakers", amount: -1200, date: "2018-12-30" },

        // Year-end entries with no month: Ekub payout +446,000 and Ema ticket -142,622
        { year: "2018 EC", month: "Year-end", group: "Ekub savings", name: "Ekub payout", amount: 446000, date: "2018-13-01" },
        { year: "2018 EC", month: "Year-end", group: "Taxes & family", name: "Ema ticket", amount: -142622, date: "2018-13-02" }
      ];

      const data2019 = [
        // Condominium rent: 30,000 in Meskerem
        { year: "2019 EC", month: "Meskerem", group: "Condominium", name: "Condominium rent", amount: 30000, date: "2019-01-10" },

        // Building 72 rent: 37,500 in Meskerem, 12,500 in Tikimt
        { year: "2019 EC", month: "Meskerem", group: "Building 72", name: "Building 72 rent", amount: 37500, date: "2019-01-15" },
        { year: "2019 EC", month: "Tikimt", group: "Building 72", name: "Building 72 rent", amount: 12500, date: "2019-02-15" },

        // Ekub contribution: -50,000 in Meskerem
        { year: "2019 EC", month: "Meskerem", group: "Ekub savings", name: "Ekub contribution", amount: -50000, date: "2019-01-20" },

        // Hawassa monitoring: -6,500 in Meskerem
        { year: "2019 EC", month: "Meskerem", group: "Hawassa lots", name: "Hawassa monitoring", amount: -6500, date: "2019-01-12" },

        // Caretakers: -1,200 per month for the first 3 months
        { year: "2019 EC", month: "Meskerem", group: "Building 72", name: "Caretakers", amount: -1200, date: "2019-01-30" },
        { year: "2019 EC", month: "Tikimt", group: "Building 72", name: "Caretakers", amount: -1200, date: "2019-02-28" },
        { year: "2019 EC", month: "Hidar", group: "Building 72", name: "Caretakers", amount: -1200, date: "2019-03-30" },

        // Water pump: -1,000 and exercise books: -1,800, both in Meskerem
        { year: "2019 EC", month: "Meskerem", group: "Building 72", name: "Water pump", amount: -1000, date: "2019-01-22" },
        { year: "2019 EC", month: "Meskerem", group: "Taxes & family", name: "Exercise books", amount: -1800, date: "2019-01-25" }
      ];

      return [...data2018, ...data2019];
    }

    // ─── STATE MANAGEMENT ───────────────────────────────────────────
    let currentYear = "2019 EC";
    let selectedMonth = null; // null = all months
    let showAllActivity = false;
    let entryType = "in"; // 'in' or 'out'

    let transactions = [];
    try {
      const stored = localStorage.getItem("betoch_transactions");
      transactions = stored ? JSON.parse(stored) : createSeedData();
    } catch (e) {
      transactions = createSeedData();
    }

    function saveToStorage() {
      try {
        localStorage.setItem("betoch_transactions", JSON.stringify(transactions));
      } catch (e) {
        console.error("Storage error:", e);
      }
    }

    const OPENING_CASH = {
      "2018 EC": 0,
      "2019 EC": 236828
    };

    function fmt(n) {
      return Number(n || 0).toLocaleString("en-ET", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      });
    }

    // ─── THEME TOGGLE ───────────────────────────────────────────────
    let isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    const savedTheme = localStorage.getItem("betoch_theme");
    if (savedTheme) isDark = savedTheme === "dark";

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
      document.getElementById("theme-icon").textContent = isDark ? "☀️" : "🌙";
    }
    applyTheme();

    function toggleTheme() {
      isDark = !isDark;
      localStorage.setItem("betoch_theme", isDark ? "dark" : "light");
      applyTheme();
    }

    // ─── COUNT UP ANIMATION ─────────────────────────────────────────
    function animateValue(elem, start, end, duration) {
      if (!elem) return;
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const current = Math.floor(progress * (end - start) + start);
        elem.textContent = fmt(current);
        if (progress < 1) {
          window.requestAnimationFrame(step);
        } else {
          elem.textContent = fmt(end);
        }
      };
      window.requestAnimationFrame(step);
    }

    // ─── YEAR SELECTION ─────────────────────────────────────────────
    function setYear(yr) {
      currentYear = yr;
      selectedMonth = null;
      document.getElementById("btn-2018").classList.toggle("active", yr === "2018 EC");
      document.getElementById("btn-2019").classList.toggle("active", yr === "2019 EC");
      renderAll();
    }

    // ─── RENDER DASHBOARD ───────────────────────────────────────────
    function renderAll() {
      const yearTx = transactions.filter((t) => t.year === currentYear);
      const opening = OPENING_CASH[currentYear] || 0;

      const moneyIn = yearTx.filter((t) => t.amount > 0).reduce((s, t) => s + t.amount, 0);
      const moneyOut = yearTx.filter((t) => t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
      const leftOver = moneyIn - moneyOut;
      const closingCash = opening + leftOver;

      // 1. Hero
      const heroCashEl = document.getElementById("hero-cash");
      animateValue(heroCashEl, 0, closingCash, 750);

      const heroChip = document.getElementById("hero-chip");
      const sign = leftOver >= 0 ? "▲ +" : "▼ -";
      heroChip.textContent = `${sign}${fmt(Math.abs(leftOver))} ETB this year`;

      // 2. Stats
      document.getElementById("stat-money-in").textContent = `${fmt(moneyIn)} ETB`;
      document.getElementById("stat-money-out").textContent = `${fmt(moneyOut)} ETB`;
      const leftOverEl = document.getElementById("stat-left-over");
      leftOverEl.textContent = `${fmt(leftOver)} ETB`;
      leftOverEl.className = `stat-val ${leftOver >= 0 ? "text-green" : "text-red"}`;

      // 3. Month by Month Chart
      renderChart(yearTx);

      // 4. Properties
      renderProperties(yearTx);

      // 5. Activity
      renderActivity(yearTx);
    }

    // ─── RENDER MONTHLY CHART ───────────────────────────────────────
    function renderChart(yearTx) {
      const grid = document.getElementById("chart-grid");
      const labels = document.getElementById("chart-labels");
      grid.innerHTML = '<div class="chart-baseline"></div>';
      labels.innerHTML = '';

      // Find max value for normalization
      let maxVal = 1;
      const monthTotals = ETH_MONTHS.map((m) => {
        const inAmt = yearTx.filter((t) => t.month === m.id && t.amount > 0).reduce((s, t) => s + t.amount, 0);
        const outAmt = yearTx.filter((t) => t.month === m.id && t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
        if (inAmt > maxVal) maxVal = inAmt;
        if (outAmt > maxVal) maxVal = outAmt;
        return { ...m, inAmt, outAmt };
      });

      monthTotals.forEach((m, idx) => {
        const inHeight = Math.round((m.inAmt / maxVal) * 80);
        const outHeight = Math.round((m.outAmt / maxVal) * 80);

        const col = document.createElement("div");
        col.className = `chart-col ${selectedMonth === m.id ? "selected" : ""}`;
        col.onclick = () => selectMonth(m.id);

        col.innerHTML = `
          <div class="bar-up-wrap">
            <div class="bar-in" style="height: ${inHeight}px"></div>
          </div>
          <div class="bar-down-wrap">
            <div class="bar-out" style="height: ${outHeight}px"></div>
          </div>
        `;
        grid.appendChild(col);

        const lbl = document.createElement("div");
        lbl.className = `month-tag ${selectedMonth === m.id ? "active" : ""}`;
        lbl.textContent = m.short;
        lbl.onclick = () => selectMonth(m.id);
        labels.appendChild(lbl);
      });

      const caption = document.getElementById("chart-caption");
      if (selectedMonth) {
        const mObj = monthTotals.find((x) => x.id === selectedMonth);
        caption.innerHTML = `<strong>${mObj.en} (${mObj.am})</strong>: +${fmt(mObj.inAmt)} / -${fmt(mObj.outAmt)} ETB (tap to clear)`;
      } else {
        caption.textContent = "Tap a month to filter";
      }
    }

    function selectMonth(mId) {
      if (selectedMonth === mId) {
        selectedMonth = null;
      } else {
        selectedMonth = mId;
      }
      renderAll();
    }

    // ─── RENDER PROPERTIES ──────────────────────────────────────────
    function renderProperties(yearTx) {
      const container = document.getElementById("prop-list");
      container.innerHTML = '';

      let maxNet = 1;
      const propData = GROUPS.map((g) => {
        const net = yearTx.filter((t) => t.group === g.id).reduce((s, t) => s + t.amount, 0);
        if (Math.abs(net) > maxNet) maxNet = Math.abs(net);
        return { ...g, net };
      });

      propData.forEach((p) => {
        const pct = Math.max(8, Math.min(100, Math.round((Math.abs(p.net) / maxNet) * 100)));
        const isPos = p.net >= 0;

        const item = document.createElement("div");
        item.className = "prop-item";
        item.innerHTML = `
          <div class="prop-icon-box" style="background: ${isPos ? "var(--green-light)" : "var(--red-light)"}">
            ${p.emoji}
          </div>
          <div class="prop-center">
            <span class="prop-title">${p.name}</span>
            <div class="prop-bar-track">
              <div class="prop-bar-fill" style="width: ${pct}%; background: ${isPos ? "var(--green)" : "var(--red)"};"></div>
            </div>
          </div>
          <span class="prop-amount ${isPos ? "text-green" : "text-red"}">
            ${isPos ? "+" : ""}${fmt(p.net)} ETB
          </span>
        `;
        container.appendChild(item);
      });
    }

    // ─── RENDER RECENT ACTIVITY ─────────────────────────────────────
    function renderActivity(yearTx) {
      const container = document.getElementById("activity-list");
      container.innerHTML = '';

      let list = [...yearTx];
      if (selectedMonth) {
        list = list.filter((t) => t.month === selectedMonth);
        document.getElementById("activity-filter-label").textContent = `Filtered: ${selectedMonth}`;
      } else {
        document.getElementById("activity-filter-label").textContent = "All entries";
      }

      // Reverse chronological
      list.reverse();

      const displayList = showAllActivity ? list : list.slice(0, 7);

      if (displayList.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 18px 0; font-size: 0.9rem;">No transactions recorded for this period.</div>`;
        document.getElementById("show-all-btn").style.display = "none";
        return;
      }

      displayList.forEach((tx) => {
        const isIncome = tx.amount > 0;
        const gObj = GROUPS.find((g) => g.id === tx.group) || { emoji: "💵" };
        const originalIndex = transactions.indexOf(tx);

        const row = document.createElement("div");
        row.className = "activity-item";
        row.innerHTML = `
          <div class="act-left">
            <div class="act-icon ${isIncome ? "" : "expense"}">
              ${gObj.emoji}
            </div>
            <div class="act-info">
              <span class="act-title">${tx.name}</span>
              <span class="act-sub">${tx.month} · ${tx.group}${tx.date ? ` · 📅 ${tx.date}` : ""}</span>
            </div>
          </div>
          <div class="act-right">
            <span class="act-amt ${isIncome ? "text-green" : "text-red"}">
              ${isIncome ? "+" : ""}${fmt(tx.amount)} ETB
            </span>
            <button class="act-del-btn" onclick="deleteEntry(${originalIndex})" title="Delete entry">✕</button>
          </div>
        `;
        container.appendChild(row);
      });

      const showBtn = document.getElementById("show-all-btn");
      if (list.length > 7) {
        showBtn.style.display = "block";
        showBtn.textContent = showAllActivity ? "Show less" : `Show all (${list.length})`;
      } else {
        showBtn.style.display = "none";
      }
    }

    function toggleShowAll() {
      showAllActivity = !showAllActivity;
      renderAll();
    }

    function deleteEntry(index) {
      if (confirm("Delete this entry?")) {
        transactions.splice(index, 1);
        saveToStorage();
        renderAll();
      }
    }

    // ─── BOTTOM SHEET / ADD TRANSACTION ─────────────────────────────
    function openSheet() {
      // Default date to today YYYY-MM-DD
      const today = new Date().toISOString().split("T")[0];
      document.getElementById("form-date").value = today;
      document.getElementById("form-amount").value = "";
      document.getElementById("form-note").value = "";
      setType("in");
      document.getElementById("sheet-overlay").classList.add("open");
    }

    function closeSheet() {
      document.getElementById("sheet-overlay").classList.remove("open");
    }

    function closeSheetOnBackdrop(e) {
      if (e.target.id === "sheet-overlay") closeSheet();
    }

    function setType(type) {
      entryType = type;
      const bIn = document.getElementById("seg-in");
      const bOut = document.getElementById("seg-out");
      if (type === "in") {
        bIn.className = "segment-btn active green";
        bOut.className = "segment-btn";
      } else {
        bIn.className = "segment-btn";
        bOut.className = "segment-btn active red";
      }
    }

    function saveEntry() {
      const amtVal = parseFloat(document.getElementById("form-amount").value);
      const noteVal = document.getElementById("form-note").value.trim();
      const groupVal = document.getElementById("form-group").value;
      const monthVal = document.getElementById("form-month").value;
      const dateVal = document.getElementById("form-date").value;

      if (!amtVal || amtVal <= 0 || !noteVal) {
        alert("Please enter a valid amount and description.");
        return;
      }

      const signedAmount = entryType === "in" ? amtVal : -amtVal;

      const newTx = {
        year: currentYear,
        month: monthVal,
        group: groupVal,
        name: noteVal,
        amount: signedAmount,
        date: dateVal
      };

      transactions.push(newTx);
      saveToStorage();
      closeSheet();
      renderAll();
    }

    // Initial render on load
    window.addEventListener("DOMContentLoaded", renderAll);
  </script>
</body>
</html>
